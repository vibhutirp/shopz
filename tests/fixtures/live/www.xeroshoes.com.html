<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What's different between the Prio, HFS, and Speed Force?", "acceptedAnswer": {"@type": "Answer", "text": "The Prio is our best-selling \"do almost anything\" shoe -- running, hiking, working out, you name it.\nWith a durable upper, it provides a bit more protection.\n\nThe Speed Force is our lightest, \"most barefoot\" shoe.\nMore feedback as you step and a mesh upper that holds like a glove, you get a \"barely there\" experience.\n\nThe HFS is lighter than the Prio, more rugged than the Speed Force.\nThe HFS's sole has a tire tread-inspired sole that's made to handle roads and have extra traction.\nThe huarache-inspired midfoot and instep straps are \"hiding\" behind a protective welded material.\nAnd the moisture wicking lining for extra comfort and breathability."}}, {"@type": "Question", "name": "Do you ship internationally?", "acceptedAnswer": {"@type": "Answer", "text": "We ship internationally using services shown at checkout; costs and options vary by destination and weight. All shipments include a tracking number (tracking visibility may vary by service and destination). Typical delivery is ~1–3 weeks, and customs processing can extend timelines. Import duties/fees may apply and are the recipient’s responsibility.\n\nIf you’re unsure whether we ship to your country, please reach out via our self-service support portal for more information. For the most up-to-date details, please refer to our Shipping Policy.\n\nAlso, check our store locator at www.xeroshoes.com/pages/stores. There may be a Xero Shoes dealer closer to you."}}, {"@type": "Question", "name": "How do I send a gift certificate?", "acceptedAnswer": {"@type": "Answer", "text": "After you purchase a gift certificate, you'll be able to enter an email address for the recipient.\n\nYou could email it to yourself and forward it at a later time if you like.\n\nYou can also take the Gift Certificate code and send it to the recipient."}}, {"@type": "Question", "name": "What's your return policy?", "acceptedAnswer": {"@type": "Answer", "text": "Please go to Xero Shoes Return Policy page to learn about our 30-day return policy."}}]}</script>
