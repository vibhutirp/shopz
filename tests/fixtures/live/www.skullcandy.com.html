<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What Is Crusher Bass?", "acceptedAnswer": {"@type": "Answer", "text": "Crusher Bass is Skullcandy's patented sensory bass technology that lets you feel low frequencies in addition to hearing them. Unlike traditional headphones, Crusher uses dedicated bass drivers to create a physical bass sensation that adds impact and immersion to music, movies, and games. Use the Crusher wheel or Skullcandy App to adjust the intensity from subtle enhancement to mind-bending bass."}}, {"@type": "Question", "name": "What Is THX® Spatial Audio?", "acceptedAnswer": {"@type": "Answer", "text": "The THX® Spatial Audio you get in Crusher 720 headphones makes you feel like you're surrounded by high-end speakers. The result is truly insane immersion that takes games, music, and movies to another level."}}, {"@type": "Question", "name": "What Is Personal Sound?", "acceptedAnswer": {"@type": "Answer", "text": "Personal Sound by Mimi is advanced sound personalization technology built directly into compatible Skullcandy headphones. Mimi is a global leader in sound personalization technology for consumer audio devices.  The technology adapts audio to your specific hearing profile, not a generic preset. The result: Clearer detail, restored audio frequencies you may be missing, safer listening over time and a more immersive experience."}}, {"@type": "Question", "name": "How Do I Turn Crusher Bass On/Off for Crusher 720?", "acceptedAnswer": {"@type": "Answer", "text": "You can adjust Crusher Bass using the Crusher wheel located on the earcup or through the Skullcandy App. Turn the wheel or move the Crusher control in the app to increase or decrease the bass intensity. To turn Crusher Bass off completely, set the control to its lowest level."}}, {"@type": "Question", "name": "How Long Does the Battery Last for Crusher 720 Headphones?", "acceptedAnswer": {"@type": "Answer", "text": "When fully charged, the battery in Crusher 720 headphones can last up to 65 hours. That's easily a week without needing to worry about where you put that charger cable."}}, {"@type": "Question", "name": "How Quick Can I Charge Crusher 720 Headphones?", "acceptedAnswer": {"@type": "Answer", "text": "The rapid charge feature on Crusher 720s enables you to get up to 4 hours of battery in just 10 minutes of charging."}}]}</script>
