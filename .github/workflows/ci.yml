name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: publish check (generic secret patterns)
        run: bash scripts/publish-check.sh
        env:
          SHOPZ_SKIP_IDENTITY: '1'   # teammates commit under their own names; identity is checked locally before our pushes
